name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Check entrypoint and Unraid template
        run: |
          sh -n docker/entrypoint.sh
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('unraid/nas-mcp.xml')"
